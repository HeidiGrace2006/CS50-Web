{% extends "auctions/layout.html" %}

{% block body %}
    <h1>{{ category.name }}</h1><br>
    <ul style="list-style: none;">
        {% for listing in listings %}
            <li style="display: flex; align-items: flex-start; margin-bottom: 20px; border-bottom: 2px solid #ddd; padding-bottom: 10px;">
                {% if listing.image_url %}
                    <img src="{{ listing.image_url }}" 
                        style="width: 300px; height: 300px; object-fit: contain; margin-right: 80px;">
                {% endif %}
                <div>
                    <a href="{% url 'listing' listing.id %}" style="font-size: 1.25em; text-decoration: none; color: #333;">
                        <b>{{ listing.title }}</b>
                    </a><br>
                    <b>Price: </b>${{ listing.current_price|floatformat:2  }}<br><br>
                    {{ listing.description }}
                </div>
            </li>
        {% endfor %}
    </ul>
{% endblock %}
